name: TeliphoneApp
options:
  bundleIdPrefix: com.teliphone
  deploymentTarget:
    iOS: "16.0"
targets:
  TeliphoneApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TeliphoneApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teliphone.ios
        PRODUCT_NAME: Teliphone
        INFOPLIST_KEY_CFBundleDisplayName: "Teliphone"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
