<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Teliphone</title>
  
  <!-- Настройки для iOS PWA и Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Teliphone">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Верхняя навигационная панель в стиле iOS -->
  <header>
    <div class="header-top">
      <div class="header-left">
        <h1>Сообщения</h1>
        <div class="status-badge">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Подключение...</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- Кнопка очистки всех сообщений -->
        <button class="icon-btn btn-danger" id="btnClearAll" title="Очистить все" onclick="confirmClearAll()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Поиск -->
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по номеру, чату или тексту">
    </div>

    <!-- Сегментный переключатель -->
    <div class="segmented-control">
      <button class="segment-btn active" data-filter="all">Все</button>
      <button class="segment-btn" data-filter="sms">SMS</button>
      <button class="segment-btn" data-filter="notif">Уведомления</button>
    </div>
  </header>

  <!-- Основной контент -->
  <main>
    <!-- Баннер включения Push-уведомлений -->
    <div class="push-banner" id="pushBanner">
      <div class="push-banner-text">🔔 Включить push-уведомления на заблокированный экран</div>
      <button class="push-btn" onclick="requestPushPermission()">Включить</button>
    </div>

    <!-- Список сообщений -->
    <div id="messagesList">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <h3>Загрузка сообщений...</h3>
      </div>
    </div>
  </main>

  <!-- Модальное окно подтверждения очистки -->
  <div class="modal-overlay" id="clearModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-title">Очистить все сообщения?</div>
      <div class="modal-desc">Вся история входящих сообщений будет безвозвратно удалена из базы данных.</div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeClearModal()">Отмена</button>
        <button class="modal-btn modal-btn-danger" onclick="executeClearAll()">Удалить все</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
